<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Film Club Trivia · JXN Film Club</title>
<meta name="viewport" content="width=1920" />

<link rel="icon" href="./favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
<link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png" />
<link rel="apple-touch-icon" sizes="180x180" href="./favicon-180.png" />

<style>
  /* ---------- Fonts ----------
     Self-hosted variable fonts in public/fonts — no Google Fonts request, so a
     deck screening leaks nothing to a third party (the promise the club's
     privacy policy relies on). Paths are relative to this document, which is
     served at the root on Cloudflare Workers and in dev alike.
     Mirrors ~/Workspace/jxnfilmclub/css/tokens.css — move them together. */

  @font-face {
    font-family: "Playfair Display";
    font-weight: 400 900;
    font-style: normal;
    font-display: swap;
    src: url("./fonts/PlayfairDisplay-VariableFont_wght.woff2") format("woff2-variations");
  }

  @font-face {
    font-family: "Playfair Display";
    font-weight: 400 900;
    font-style: italic;
    font-display: swap;
    src: url("./fonts/PlayfairDisplay-Italic-VariableFont_wght.woff2") format("woff2-variations");
  }

  @font-face {
    font-family: "Oswald";
    font-weight: 200 700;
    font-style: normal;
    font-display: swap;
    src: url("./fonts/Oswald-VariableFont_wght.woff2") format("woff2-variations");
  }

  @font-face {
    font-family: "Newsreader";
    font-weight: 200 800;
    font-style: normal;
    font-display: swap;
    src: url("./fonts/Newsreader-VariableFont_opsz-wght.woff2") format("woff2-variations");
  }

  @font-face {
    font-family: "Newsreader";
    font-weight: 200 800;
    font-style: italic;
    font-display: swap;
    src: url("./fonts/Newsreader-Italic-VariableFont_opsz-wght.woff2") format("woff2-variations");
  }

  /* Duplicates PALETTE.ink / PALETTE.paper / PALETTE.rust in src/slides.jsx —
     change both together. */
  html, body { margin: 0; padding: 0; background: #100f0e; color: #e8e3d8; font-family: 'Newsreader', Georgia, serif; }
  * { box-sizing: border-box; }
  ::selection { background: #d7321f; color: #ffffff; }
  /* deck-stage children inherit absolute positioning — the stage handles layout */
</style>
</head>
<body>

<div id="root"></div>

<script type="module" src="/src/main.jsx"></script>

</body>
</html>
